<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 00 — Presentación del curso</title>
  <link rel="stylesheet" href="../../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../../node_modules/reveal.js/dist/theme/black.css">
  <link rel="stylesheet" href="../../../node_modules/reveal.js/plugin/highlight/monokai.css">
  <link rel="stylesheet" href="../../../_config/theme/custom.css">
  <link rel="stylesheet" href="../../../_config/theme/components.css">
  <style>
    /* Safety net for dense slides: when a slide's content exceeds the
       canvas height, show a vertical scrollbar instead of clipping
       the bottom. Only kicks in when overflow is real. */
    .reveal .slides > section,
    .reveal .slides > section > section {
      overflow-y: auto;
      max-height: 100%;
    }

    /* Bloque de texto centrado fuera de cajas. Cada bloque lleva su
       propio max-width para no depender de <br> entre oraciones. */
    .s00-statement {
      max-width: 980px;
      margin: 0 auto;
      font-size: 1.6rem;
      line-height: 1.45;
    }
    .s00-statement-punch {
      max-width: 980px;
      margin: 1.4rem auto 0;
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.35;
    }
    .s00-note {
      max-width: 900px;
      margin: 1.6rem auto 0;
      font-size: 1.05rem;
      opacity: 0.75;
    }

    /* Arbol de directorios. Deliberadamente NO usa <pre><code>: el
       plugin de highlight escapa el HTML inline y las anotaciones al
       margen saldrian como texto literal. */
    .s00-tree {
      font-family: monospace;
      font-size: 1.15rem;
      line-height: 1.75;
      white-space: pre-wrap;
      text-align: left;
      max-width: 760px;
      margin: 0 auto;
      background: var(--bg-secondary, #1a1a1a);
      border-radius: 8px;
      padding: 1.4rem 1.8rem;
    }
    .s00-tree .ann {
      color: var(--accent-secondary);
      opacity: 0.9;
    }
    .s00-tree .dir {
      color: var(--accent);
      font-weight: 600;
    }

    /* Pasos numerados de la slide 10 — unica lista enumerativa del deck. */
    .s00-steps {
      list-style: none;
      counter-reset: s00step;
      max-width: 860px;
      margin: 0 auto;
      padding: 0;
      text-align: left;
    }
    .s00-steps li {
      counter-increment: s00step;
      position: relative;
      padding-left: 3.2rem;
      margin-bottom: 1.1rem;
      font-size: 1.2rem;
      line-height: 1.5;
    }
    .s00-steps li::before {
      content: counter(s00step);
      position: absolute;
      left: 0;
      top: -0.1rem;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- SECCIONES -->

    </div>
  </div>

  <script src="../../../node_modules/reveal.js/dist/reveal.js"></script>
  <script src="../../../node_modules/reveal.js/plugin/highlight/highlight.js"></script>
  <script src="../../../node_modules/reveal.js/plugin/notes/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      transition: 'fade',
      width: 1280,
      height: 800,
      margin: 0.02,
      plugins: [RevealHighlight, RevealNotes]
    });
  </script>
</body>
</html>
